---
name: 04 - Using Actions
on:
  push: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 21.x
      - name: Install Dependencies
        run: npm ci
